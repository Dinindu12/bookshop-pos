<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POS - Bookshop</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <!-- Navbar -->
    <nav class="navbar">
      <h1>📚 Bookshop POS</h1>
      <div class="nav-links">
        <span id="userName">👋 </span>
        <button id="logoutBtn" class="btn-danger">Logout</button>
      </div>
    </nav>

    <div class="main-layout">
      <!-- Left Panel: Books -->
      <div class="books-panel">
        <div class="search-bar">
          <input type="text" id="barcodeInput" placeholder="🔍 Scan ISBN Barcode">
          <input type="text" id="searchInput" placeholder="Search books...">
        </div>
        <div id="bookList" class="book-grid"></div>
      </div>

      <!-- Right Panel: Cart -->
      <div class="cart-panel">
        <h2>🛒 Cart</h2>
        <div class="customer-section">
          <input type="text" id="customerSearch" placeholder="Search customer by name">
          <div id="customerSuggestions" class="suggestions"></div>
        </div>
        <div id="cartItems" class="cart-items"></div>
        <div class="cart-summary">
          <p class="total">Total: <span id="cartTotal">$0.00</span></p>
          <button id="checkoutBtn" class="btn-success">💳 Checkout</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>POS Admin Dashboard</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; }
    body { background:#f4f6f9; display:flex; min-height:100vh; }

    /* ===== SIDEBAR ===== */
    .sidebar { 
      width:220px; background:#2c3e50; color:white; height:100vh; 
      padding:16px; position:sticky; top:0; overflow-y:auto; 
      flex-shrink:0; transition:0.3s; z-index:100;
    }
    .sidebar h2 { font-size:18px; margin-bottom:24px; text-align:center; }
    .sidebar button { 
      display:block; width:100%; padding:12px 14px; margin:4px 0; 
      background:transparent; border:none; color:white; text-align:left; 
      font-size:14px; cursor:pointer; border-radius:8px; transition:0.3s; 
    }
    .sidebar button:hover, .sidebar button.active { background:#34495e; }
    .sidebar .logout-btn { margin-top:30px; background:#e74c3c; text-align:center; border-radius:8px; }
    .sidebar .logout-btn:hover { background:#c0392b; }

    /* ===== MAIN CONTENT ===== */
    .main { flex:1; padding:16px; overflow-y:auto; max-height:100vh; }
    
    /* Mobile Toggle Button */
    .menu-toggle { display:none; background:#2c3e50; color:white; border:none; padding:10px 16px; border-radius:8px; font-size:18px; cursor:pointer; margin-bottom:12px; width:100%; text-align:left; }

    /* Stats Cards */
    .stats { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:12px; margin-bottom:20px; }
    .stat-card { background:white; padding:16px; border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,0.06); text-align:center; }
    .stat-card h3 { font-size:13px; color:#7f8c8d; margin-bottom:4px; }
    .stat-card p { font-size:22px; font-weight:700; color:#2c3e50; }

    /* Sections */
    .section { display:none; background:white; border-radius:12px; padding:16px; box-shadow:0 2px 8px rgba(0,0,0,0.06); }
    .section.active { display:block; }
    .section h2 { font-size:18px; margin-bottom:12px; color:#2c3e50; }

    /* Tables - Scrollable on mobile */
    .table-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; }
    table { width:100%; border-collapse:collapse; font-size:14px; min-width:500px; }
    th, td { padding:8px 10px; border-bottom:1px solid #eee; text-align:left; white-space:nowrap; }
    th { background:#f8f9fa; font-weight:600; }

    /* Forms */
    .flex-row { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
    .flex-row input, .flex-row select { padding:8px 12px; border:1px solid #ddd; border-radius:6px; font-size:13px; flex:1; min-width:100px; }
    .btn { padding:8px 16px; background:#3498db; color:white; border:none; border-radius:6px; cursor:pointer; font-size:13px; }
    .btn:hover { background:#2980b9; }
    .btn-danger { background:#e74c3c; }
    .btn-danger:hover { background:#c0392b; }
    .btn-success { background:#2ecc71; }
    .btn-success:hover { background:#27ae60; }

    .badge { padding:4px 10px; border-radius:12px; font-size:11px; font-weight:600; display:inline-block; }
    .badge-pending { background:#f39c12; color:white; }
    .badge-confirmed { background:#3498db; color:white; }
    .badge-shipped { background:#9b59b6; color:white; }
    .badge-cancelled { background:#e74c3c; color:white; }
    .badge-completed { background:#2ecc71; color:white; }

    /* Mobile Responsive */
    @media (max-width:768px) {
      body { flex-direction:column; }
      
      /* Sidebar becomes hidden by default, shown with toggle */
      .sidebar { 
        position:fixed; top:0; left:-240px; height:100vh; width:220px; 
        z-index:999; transition:0.3s; box-shadow:2px 0 10px rgba(0,0,0,0.2);
      }
      .sidebar.open { left:0; }
      .sidebar-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.4); z-index:998; }
      .sidebar-overlay.active { display:block; }
      
      .menu-toggle { display:block; }
      .main { padding:10px; max-height:none; }
      .stats { grid-template-columns:repeat(2,1fr); gap:8px; }
      .stat-card { padding:12px; }
      .stat-card p { font-size:18px; }
      .section { padding:12px; }
      table { font-size:12px; min-width:400px; }
      th, td { padding:6px 8px; }
      .flex-row input { min-width:80px; font-size:12px; }
      .btn { padding:6px 12px; font-size:12px; }
    }

    @media (max-width:480px) {
      .stats { grid-template-columns:1fr 1fr; gap:6px; }
      .stat-card p { font-size:16px; }
      .stat-card h3 { font-size:11px; }
      .sidebar { width:200px; left:-200px; }
      .section h2 { font-size:16px; }
    }
  </style>
</head>
<body>

  <!-- Sidebar Overlay (mobile) -->
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">
    <h2>📚 POS Admin</h2>
    <button class="active" onclick="showSection('dashboard')">📊 Dashboard</button>
    <button onclick="showSection('inventory')">📦 Inventory</button>
    <button onclick="showSection('orders')">📋 Orders</button>
    <button onclick="showSection('offers')">🏷️ Offers</button>
    <button onclick="showSection('revenue')">💰 Revenue</button>
    <button class="logout-btn" onclick="window.location.href='index.html'">🚪 Logout</button>
  </div>

  <!-- Main Content -->
  <div class="main">
    <!-- Mobile Menu Toggle -->
    <button class="menu-toggle" onclick="toggleSidebar()">☰ Menu</button>

    <!-- DASHBOARD -->
    <div id="dashboard" class="section active">
      <h2>📊 Dashboard</h2>
      <div class="stats" id="statsCards"></div>
      <h3 style="margin-top:16px;font-size:15px;">Recent Orders</h3>
      <div class="table-wrap"><div id="recentOrders"></div></div>
    </div>

    <!-- INVENTORY -->
    <div id="inventory" class="section">
      <h2>📦 Inventory</h2>
      <div class="flex-row">
        <input id="itemName" placeholder="Name">
        <input id="itemPrice" placeholder="Price" type="number">
        <input id="itemStock" placeholder="Stock" type="number">
        <input id="itemCategory" placeholder="Category">
        <button class="btn btn-success" onclick="addItem()">➕ Add</button>
      </div>
      <div class="table-wrap">
        <table><thead><tr><th>Name</th><th>Price</th><th>Stock</th><th>Category</th><th>Actions</th></tr></thead>
          <tbody id="inventoryTable"></tbody>
        </table>
      </div>
    </div>

    <!-- ORDERS -->
    <div id="orders" class="section">
      <h2>📋 Orders</h2>
      <div class="table-wrap">
        <table><thead><tr><th>Bill #</th><th>Customer</th><th>Total</th><th>Status</th><th>Action</th></tr></thead>
          <tbody id="ordersTable"></tbody>
        </table>
      </div>
    </div>

    <!-- OFFERS -->
    <div id="offers" class="section">
      <h2>🏷️ Offers</h2>
      <div class="flex-row">
        <input id="offerCode" placeholder="Code (e.g., SALE10)">
        <input id="offerDiscount" placeholder="Discount %" type="number">
        <button class="btn btn-success" onclick="addOffer()">Create Offer</button>
      </div>
      <div id="offerList"></div>
    </div>

    <!-- REVENUE -->
    <div id="revenue" class="section">
      <h2>💰 Revenue</h2>
      <div id="revenueStats" class="stats"></div>
    </div>
  </div>

  <script type="module">
    import { db, collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc, getDocs } from './firebase-config.js';
    import { auth, onAuthStateChanged } from './firebase-config.js';

    // Auth check
    onAuthStateChanged(auth, (user) => {
      if (!user) window.location.href = 'index.html';
    });

    // Sidebar Toggle (Mobile)
    window.toggleSidebar = () => {
      document.getElementById('sidebar').classList.toggle('open');
      document.getElementById('sidebarOverlay').classList.toggle('active');
    };

    // Show Section
    window.showSection = (id) => {
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      document.querySelectorAll('.sidebar button').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.sidebar button').forEach(b => {
        if (b.textContent.toLowerCase().includes(id)) b.classList.add('active');
      });
      // Close sidebar on mobile after selection
      if (window.innerWidth <= 768) {
        document.getElementById('sidebar').classList.remove('open');
        document.getElementById('sidebarOverlay').classList.remove('active');
      }
    };

    // ===== STATS =====
    async function updateStats() {
      const itemsSnap = await getDocs(collection(db, 'items'));
      const ordersSnap = await getDocs(collection(db, 'orders'));
      let total = 0, pending = 0, completed = 0;
      ordersSnap.forEach(d => {
        const data = d.data();
        if (data.status !== 'cancelled') total += data.total || 0;
        if (data.status === 'pending') pending++;
        if (data.status === 'completed') completed++;
      });
      document.getElementById('statsCards').innerHTML = `
        <div class="stat-card"><h3>📦 Items</h3><p>${itemsSnap.size}</p></div>
        <div class="stat-card"><h3>📋 Orders</h3><p>${ordersSnap.size}</p></div>
        <div class="stat-card"><h3>⏳ Pending</h3><p>${pending}</p></div>
        <div class="stat-card"><h3>💰 Revenue</h3><p>$${total.toFixed(2)}</p></div>
      `;
      
      // Recent Orders
      const recent = document.getElementById('recentOrders');
      let html = '<table><thead><tr><th>Customer</th><th>Total</th><th>Status</th></tr></thead><tbody>';
      let count = 0;
      ordersSnap.forEach(d => {
        if (count >= 5) return;
        const data = d.data();
        html += `<tr><td>${data.customerName || 'Walk-in'}</td><td>$${data.total?.toFixed(2)}</td><td><span class="badge badge-${data.status || 'pending'}">${data.status || 'pending'}</span></td></tr>`;
        count++;
      });
      html += '</tbody></table>';
      recent.innerHTML = html || '<p style="color:#95a5a6;padding:12px;">No recent orders</p>';
    }

    // ===== INVENTORY =====
    onSnapshot(collection(db, 'items'), (snap) => {
      const tbody = document.getElementById('inventoryTable');
      tbody.innerHTML = '';
      snap.forEach(doc => {
        const d = doc.data();
        tbody.innerHTML += `<tr>
          <td>${d.name || 'Item'}</td>
          <td>$${d.price?.toFixed(2) || '0.00'}</td>
          <td>${d.stock || 0}</td>
          <td>${d.category || '-'}</td>
          <td>
            <button class="btn btn-success" onclick="updateItem('${doc.id}')" style="padding:4px 10px;font-size:12px;">✏️</button>
            <button class="btn btn-danger" onclick="deleteItem('${doc.id}')" style="padding:4px 10px;font-size:12px;">🗑️</button>
          </td>
        </tr>`;
      });
      updateStats();
    }, (err) => console.warn('Inventory error:', err));

    window.addItem = async () => {
      const name = document.getElementById('itemName').value.trim();
      const price = parseFloat(document.getElementById('itemPrice').value);
      const stock = parseInt(document.getElementById('itemStock').value) || 0;
      const category = document.getElementById('itemCategory').value.trim();
      if (!name || !price) return alert('Name and Price required');
      await addDoc(collection(db, 'items'), { name, price, stock, category });
      document.getElementById('itemName').value = '';
      document.getElementById('itemPrice').value = '';
      document.getElementById('itemStock').value = '';
      document.getElementById('itemCategory').value = '';
    };

    window.deleteItem = async (id) => {
      if (confirm('Delete this item?')) await deleteDoc(doc(db, 'items', id));
    };

    window.updateItem = async (id) => {
      const newStock = prompt('Enter new stock quantity:');
      if (newStock !== null && !isNaN(newStock)) {
        await updateDoc(doc(db, 'items', id), { stock: parseInt(newStock) });
      }
    };

    // ===== ORDERS =====
    onSnapshot(collection(db, 'orders'), (snap) => {
      const tbody = document.getElementById('ordersTable');
      tbody.innerHTML = '';
      snap.forEach(doc => {
        const d = doc.data();
        tbody.innerHTML += `<tr>
          <td>${d.billNumber || 'N/A'}</td>
          <td>${d.customerName || 'Walk-in'}</td>
          <td>$${d.total?.toFixed(2) || '0.00'}</td>
          <td><span class="badge badge-${d.status || 'pending'}">${d.status || 'pending'}</span></td>
          <td>
            <select onchange="updateOrderStatus('${doc.id}', this.value)" style="padding:4px;border-radius:4px;border:1px solid #ddd;font-size:12px;">
              <option value="pending" ${d.status==='pending'?'selected':''}>Pending</option>
              <option value="confirmed" ${d.status==='confirmed'?'selected':''}>Confirmed</option>
              <option value="shipped" ${d.status==='shipped'?'selected':''}>Shipped</option>
              <option value="completed" ${d.status==='completed'?'selected':''}>Completed</option>
              <option value="cancelled" ${d.status==='cancelled'?'selected':''}>Cancelled</option>
            </select>
          </td>
        </tr>`;
      });
      updateStats();
    }, (err) => console.warn('Orders error:', err));

    window.updateOrderStatus = async (id, status) => {
      await updateDoc(doc(db, 'orders', id), { status, updatedAt: new Date().toISOString() });
    };

    // ===== OFFERS =====
    window.addOffer = async () => {
      const code = document.getElementById('offerCode').value.trim();
      const discount = parseFloat(document.getElementById('offerDiscount').value);
      if (!code || !discount) return alert('Enter code and discount');
      await addDoc(collection(db, 'offers'), { code, discount, active: true, createdAt: new Date().toISOString() });
      document.getElementById('offerCode').value = '';
      document.getElementById('offerDiscount').value = '';
      loadOffers();
    };

    function loadOffers() {
      onSnapshot(collection(db, 'offers'), (snap) => {
        const container = document.getElementById('offerList');
        container.innerHTML = '';
        snap.forEach(doc => {
          const d = doc.data();
          container.innerHTML += `
            <div style="background:#f8f9fa;padding:10px 14px;margin:6px 0;border-radius:8px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
              <span><strong>${d.code}</strong> - ${d.discount}% off ${d.active ? '✅ Active' : '❌ Inactive'}</span>
              <button onclick="deleteDoc(doc(db,'offers','${doc.id}'))" style="background:#e74c3c;color:white;border:none;padding:4px 12px;border-radius:4px;cursor:pointer;">Remove</button>
            </div>
          `;
        });
      }, (err) => console.warn('Offers error:', err));
    }
    loadOffers();

    // ===== REVENUE =====
    async function loadRevenue() {
      const ordersSnap = await getDocs(collection(db, 'orders'));
      let total = 0, pending = 0, completed = 0, cancelled = 0;
      ordersSnap.forEach(d => {
        const data = d.data();
        if (data.status === 'pending') pending++;
        else if (data.status === 'completed') { completed++; total += data.total || 0; }
        else if (data.status === 'cancelled') cancelled++;
      });
      document.getElementById('revenueStats').innerHTML = `
        <div class="stat-card"><h3>💰 Total Revenue</h3><p>$${total.toFixed(2)}</p></div>
        <div class="stat-card"><h3>✅ Completed</h3><p>${completed}</p></div>
        <div class="stat-card"><h3>⏳ Pending</h3><p>${pending}</p></div>
        <div class="stat-card"><h3>❌ Cancelled</h3><p>${cancelled}</p></div>
      `;
    }
    loadRevenue();

    // Initial stats load
    setTimeout(updateStats, 500);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>POS Admin Dashboard</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; }
    body { background:#f4f6f9; min-height:100vh; }

    .top-header {
      background:#2c3e50;
      color:white;
      padding:12px 16px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      position:sticky;
      top:0;
      z-index:1000;
      box-shadow:0 2px 8px rgba(0,0,0,0.2);
      flex-wrap:wrap;
      gap:8px;
    }
    .top-header .brand { display:flex; align-items:center; gap:12px; }
    .top-header .brand h1 { font-size:18px; font-weight:600; }
    .top-header .brand span { font-size:20px; }
    .hamburger { background:transparent; border:none; color:white; font-size:28px; cursor:pointer; padding:4px 8px; border-radius:6px; transition:0.3s; display:flex; align-items:center; justify-content:center; }
    .hamburger:hover { background:rgba(255,255,255,0.1); }
    .header-actions { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
    .header-actions .user-email { font-size:12px; color:#b0bec5; display:none; }
    .header-actions .logout-btn { background:#e74c3c; color:white; border:none; padding:6px 14px; border-radius:6px; cursor:pointer; font-size:13px; font-weight:500; transition:0.3s; }
    .header-actions .logout-btn:hover { background:#c0392b; }
    .header-actions .marketplace-btn { background:#2ecc71; color:white; border:none; padding:6px 14px; border-radius:6px; cursor:pointer; font-size:13px; font-weight:500; transition:0.3s; display:flex; align-items:center; gap:4px; }
    .header-actions .marketplace-btn:hover { background:#27ae60; }

    .sidebar-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:999; transition:0.3s; }
    .sidebar-overlay.active { display:block; }
    .sidebar {
      position:fixed; top:0; left:-280px; width:270px; height:100vh; background:#2c3e50; color:white; padding:16px 0; z-index:1001; transition:0.3s ease; overflow-y:auto; box-shadow:2px 0 20px rgba(0,0,0,0.3);
    }
    .sidebar.open { left:0; }
    .sidebar .sidebar-brand { padding:0 20px 20px 20px; border-bottom:1px solid #34495e; margin-bottom:12px; display:flex; align-items:center; gap:10px; }
    .sidebar .sidebar-brand h2 { font-size:18px; }
    .sidebar .sidebar-brand span { font-size:24px; }
    .sidebar .close-btn { background:transparent; border:none; color:#95a5a6; font-size:24px; cursor:pointer; float:right; padding:0 4px; }
    .sidebar .close-btn:hover { color:white; }
    .sidebar button.nav-item {
      display:flex; align-items:center; gap:12px; width:100%; padding:12px 20px; margin:2px 0; background:transparent; border:none; color:#b0bec5; text-align:left; font-size:14px; cursor:pointer; transition:0.3s; border-left:3px solid transparent;
    }
    .sidebar button.nav-item:hover { background:#34495e; color:white; border-left-color:#3498db; }
    .sidebar button.nav-item.active { background:#34495e; color:white; border-left-color:#3498db; }
    .sidebar button.nav-item .icon { font-size:18px; min-width:24px; }
    .sidebar .nav-divider { height:1px; background:#34495e; margin:8px 16px; }

    .main-content { padding:12px; max-width:1400px; margin:0 auto; transition:0.3s; }
    .stats-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:16px; }
    .stat-card { background:white; padding:14px; border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,0.06); text-align:center; }
    .stat-card .stat-icon { font-size:24px; margin-bottom:4px; }
    .stat-card .stat-number { font-size:22px; font-weight:700; color:#2c3e50; }
    .stat-card .stat-label { font-size:11px; color:#7f8c8d; margin-top:2px; }

    .section { display:none; background:white; border-radius:12px; padding:16px; box-shadow:0 2px 8px rgba(0,0,0,0.06); }
    .section.active { display:block; }
    .section h2 { font-size:17px; margin-bottom:12px; color:#2c3e50; display:flex; align-items:center; gap:8px; }

    .table-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; margin:0 -4px; }
    table { width:100%; border-collapse:collapse; font-size:13px; min-width:480px; }
    th, td { padding:8px 10px; border-bottom:1px solid #eee; text-align:left; white-space:nowrap; }
    th { background:#f8f9fa; font-weight:600; color:#2c3e50; }
    td { color:#34495e; }

    .form-row { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
    .form-row input, .form-row select { padding:8px 12px; border:1px solid #ddd; border-radius:6px; font-size:13px; flex:1; min-width:80px; }
    .form-row input:focus, .form-row select:focus { border-color:#3498db; outline:none; }

    .btn { padding:8px 16px; border:none; border-radius:6px; cursor:pointer; font-size:13px; font-weight:500; transition:0.3s; white-space:nowrap; }
    .btn:hover { transform:scale(1.02); }
    .btn-primary { background:#3498db; color:white; }
    .btn-primary:hover { background:#2980b9; }
    .btn-success { background:#2ecc71; color:white; }
    .btn-success:hover { background:#27ae60; }
    .btn-danger { background:#e74c3c; color:white; }
    .btn-danger:hover { background:#c0392b; }
    .btn-sm { padding:4px 10px; font-size:12px; }

    .badge { padding:3px 10px; border-radius:12px; font-size:11px; font-weight:600; display:inline-block; }
    .badge-pending { background:#f39c12; color:white; }
    .badge-confirmed { background:#3498db; color:white; }
    .badge-shipped { background:#9b59b6; color:white; }
    .badge-completed { background:#2ecc71; color:white; }
    .badge-cancelled { background:#e74c3c; color:white; }

    .offer-item { background:#f8f9fa; padding:10px 14px; margin:6px 0; border-radius:8px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; }
    .offer-item .offer-info { font-size:14px; }
    .offer-item .offer-info strong { color:#2c3e50; }

    @media (min-width:769px) {
      .hamburger { display:none; }
      .sidebar-overlay { display:none !important; }
      .sidebar { position:sticky; top:0; left:0; width:220px; height:100vh; box-shadow:2px 0 8px rgba(0,0,0,0.06); border-radius:0; flex-shrink:0; }
      .sidebar .close-btn { display:none; }
      .top-header .brand h1 { font-size:20px; }
      .header-actions .user-email { display:inline; }
      body { display:flex; }
      .main-content { flex:1; padding:20px; }
      .stats-grid { grid-template-columns:repeat(4,1fr); gap:16px; }
      .stat-card { padding:20px; }
      .stat-card .stat-number { font-size:26px; }
    }
    @media (max-width:768px) {
      .stats-grid { grid-template-columns:repeat(2,1fr); gap:8px; }
      .stat-card { padding:12px; }
      .stat-card .stat-number { font-size:18px; }
      .section { padding:12px; }
      .section h2 { font-size:15px; }
      table { font-size:12px; min-width:360px; }
      th, td { padding:6px 8px; }
      .form-row input { min-width:60px; font-size:12px; padding:6px 10px; }
      .btn { font-size:12px; padding:6px 12px; }
      .top-header .brand h1 { font-size:16px; }
    }
    @media (max-width:480px) {
      .stats-grid { grid-template-columns:1fr 1fr; gap:6px; }
      .stat-card { padding:10px; }
      .stat-card .stat-number { font-size:16px; }
      .sidebar { width:250px; left:-260px; }
      .top-header { padding:8px 12px; }
      .top-header .brand h1 { font-size:14px; }
      .hamburger { font-size:24px; }
    }
    .sidebar::-webkit-scrollbar { width:4px; }
    .sidebar::-webkit-scrollbar-track { background:#2c3e50; }
    .sidebar::-webkit-scrollbar-thumb { background:#34495e; border-radius:4px; }
    .sidebar::-webkit-scrollbar-thumb:hover { background:#4a6274; }
  </style>
</head>
<body>

  <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

  <div class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <span>📚</span>
      <h2>POS Admin</h2>
      <button class="close-btn" onclick="closeSidebar()">✕</button>
    </div>
    <button class="nav-item active" onclick="showSection('dashboard', this)"><span class="icon">📊</span> Dashboard</button>
    <button class="nav-item" onclick="showSection('inventory', this)"><span class="icon">📦</span> Inventory</button>
    <button class="nav-item" onclick="showSection('orders', this)"><span class="icon">📋</span> Orders</button>
    <button class="nav-item" onclick="showSection('offers', this)"><span class="icon">🏷️</span> Offers</button>
    <button class="nav-item" onclick="showSection('revenue', this)"><span class="icon">💰</span> Revenue</button>
    <div class="nav-divider"></div>
    <button class="nav-item" onclick="window.open('https://dinindu12.github.io/bookshop-customer/', '_blank')"><span class="icon">🛒</span> Customer Store</button>
    <button class="nav-item" onclick="window.location.href='index.html'" style="color:#e74c3c;"><span class="icon">🚪</span> Logout</button>
  </div>

  <div class="main-content">
    <div class="top-header">
      <div class="brand">
        <button class="hamburger" onclick="toggleSidebar()">☰</button>
        <span>📚</span>
        <h1>POS Dashboard</h1>
      </div>
      <div class="header-actions">
        <span class="user-email" id="userEmailDisplay">admin@test.com</span>
        <button class="marketplace-btn" onclick="window.open('https://dinindu12.github.io/bookshop-customer/', '_blank')">🛒 Marketplace</button>
        <button class="logout-btn" onclick="window.location.href='index.html'">Logout</button>
      </div>
    </div>

    <div id="dashboard" class="section active">
      <h2>📊 Dashboard</h2>
      <div class="stats-grid" id="statsCards"></div>
      <h3 style="margin-top:16px;font-size:14px;color:#2c3e50;">Recent Orders</h3>
      <div class="table-wrap"><div id="recentOrders"></div></div>
    </div>

    <div id="inventory" class="section">
      <h2>📦 Inventory Management</h2>
      <div class="form-row">
        <input id="itemName" placeholder="Name">
        <input id="itemPrice" placeholder="Price" type="number" step="0.01">
        <input id="itemStock" placeholder="Stock" type="number">
        <input id="itemCategory" placeholder="Category">
        <button class="btn btn-success" onclick="addItem()">➕ Add</button>
      </div>
      <div class="table-wrap">
        <table><thead><tr><th>Name</th><th>Price</th><th>Stock</th><th>Category</th><th>Actions</th></tr></thead>
          <tbody id="inventoryTable"></tbody>
        </table>
      </div>
    </div>

    <div id="orders" class="section">
      <h2>📋 Orders Management</h2>
      <div class="table-wrap">
        <table><thead><tr><th>Bill #</th><th>Customer</th><th>Total</th><th>Status</th><th>Action</th></tr></thead>
          <tbody id="ordersTable"></tbody>
        </table>
      </div>
    </div>

    <div id="offers" class="section">
      <h2>🏷️ Offers / Discounts</h2>
      <div class="form-row">
        <input id="offerCode" placeholder="Code (e.g., SALE10)">
        <input id="offerDiscount" placeholder="Discount %" type="number">
        <button class="btn btn-success" onclick="addOffer()">➕ Create</button>
      </div>
      <div id="offerList"></div>
    </div>

    <div id="revenue" class="section">
      <h2>💰 Revenue Summary</h2>
      <div class="stats-grid" id="revenueStats"></div>
    </div>
  </div>

  <script type="module">
    import { db, collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc, getDocs, getDoc } from './firebase-config.js';
    import { auth, onAuthStateChanged } from './firebase-config.js';

    onAuthStateChanged(auth, async (user) => {
      if (!user) { window.location.href = 'index.html'; return; }
      document.getElementById('userEmailDisplay').textContent = user.email || 'User';
      try {
        const docSnap = await getDoc(doc(db, 'users', user.uid));
        if (docSnap.exists()) {
          const role = docSnap.data().role;
          if (role !== 'admin' && role !== 'owner') { window.location.href = 'marketplace.html'; }
        }
      } catch (e) { console.warn('Role check error:', e); }
    });

    window.toggleSidebar = () => {
      document.getElementById('sidebar').classList.toggle('open');
      document.getElementById('sidebarOverlay').classList.toggle('active');
    };
    window.closeSidebar = () => {
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('sidebarOverlay').classList.remove('active');
    };
    window.showSection = (id, btn) => {
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      document.querySelectorAll('.sidebar .nav-item').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      closeSidebar();
    };

    async function updateStats() {
      try {
        const itemsSnap = await getDocs(collection(db, 'items'));
        const ordersSnap = await getDocs(collection(db, 'orders'));
        let total = 0, pending = 0;
        ordersSnap.forEach(d => { const data = d.data(); if (data.status !== 'cancelled') total += data.total || 0; if (data.status === 'pending') pending++; });
        document.getElementById('statsCards').innerHTML = `
          <div class="stat-card"><div class="stat-icon">📦</div><div class="stat-number">${itemsSnap.size}</div><div class="stat-label">Items</div></div>
          <div class="stat-card"><div class="stat-icon">📋</div><div class="stat-number">${ordersSnap.size}</div><div class="stat-label">Orders</div></div>
          <div class="stat-card"><div class="stat-icon">⏳</div><div class="stat-number">${pending}</div><div class="stat-label">Pending</div></div>
          <div class="stat-card"><div class="stat-icon">💰</div><div class="stat-number">$${total.toFixed(2)}</div><div class="stat-label">Revenue</div></div>
        `;
        const recent = document.getElementById('recentOrders');
        let html = '<table><thead><tr><th>Customer</th><th>Total</th><th>Status</th></tr></thead><tbody>';
        let count = 0;
        ordersSnap.forEach(d => { if (count >= 5) return; const data = d.data(); html += `<tr><td>${data.customerName || 'Walk-in'}</td><td>$${data.total?.toFixed(2)||'0.00'}</td><td><span class="badge badge-${data.status||'pending'}">${data.status||'pending'}</span></td></tr>`; count++; });
        html += '</tbody></table>';
        recent.innerHTML = html || '<p style="color:#95a5a6;padding:12px;">No recent orders</p>';
      } catch (e) { console.warn('Stats error:', e); }
    }

    onSnapshot(collection(db, 'items'), (snap) => {
      const tbody = document.getElementById('inventoryTable');
      tbody.innerHTML = '';
      snap.forEach(doc => {
        const d = doc.data();
        tbody.innerHTML += `<tr><td>${d.name || 'Item'}</td><td>$${d.price?.toFixed(2)||'0.00'}</td><td>${d.stock||0}</td><td>${d.category||'-'}</td><td><button class="btn btn-primary btn-sm" onclick="updateItem('${doc.id}')">✏️</button><button class="btn btn-danger btn-sm" onclick="deleteItem('${doc.id}')">🗑️</button></td></tr>`;
      });
      updateStats();
    });

    window.addItem = async () => {
      const name = document.getElementById('itemName').value.trim();
      const price = parseFloat(document.getElementById('itemPrice').value);
      const stock = parseInt(document.getElementById('itemStock').value) || 0;
      const category = document.getElementById('itemCategory').value.trim();
      if (!name || isNaN(price)) return alert('Name and Price required');
      await addDoc(collection(db, 'items'), { name, price, stock, category });
      ['itemName','itemPrice','itemStock','itemCategory'].forEach(id => document.getElementById(id).value = '');
    };
    window.deleteItem = async (id) => { if (confirm('Delete?')) await deleteDoc(doc(db, 'items', id)); };
    window.updateItem = async (id) => {
      const newStock = prompt('Enter new stock:');
      if (newStock !== null && !isNaN(newStock)) await updateDoc(doc(db, 'items', id), { stock: parseInt(newStock) });
    };

    onSnapshot(collection(db, 'orders'), (snap) => {
      const tbody = document.getElementById('ordersTable');
      tbody.innerHTML = '';
      snap.forEach(doc => {
        const d = doc.data();
        tbody.innerHTML += `<tr><td>${d.billNumber||'N/A'}</td><td>${d.customerName||'Walk-in'}</td><td>$${d.total?.toFixed(2)||'0.00'}</td><td><span class="badge badge-${d.status||'pending'}">${d.status||'pending'}</span></td><td><select onchange="updateOrderStatus('${doc.id}', this.value)" style="padding:4px;border-radius:4px;border:1px solid #ddd;font-size:12px;"><option value="pending" ${d.status==='pending'?'selected':''}>Pending</option><option value="confirmed" ${d.status==='confirmed'?'selected':''}>Confirmed</option><option value="shipped" ${d.status==='shipped'?'selected':''}>Shipped</option><option value="completed" ${d.status==='completed'?'selected':''}>Completed</option><option value="cancelled" ${d.status==='cancelled'?'selected':''}>Cancelled</option></select></td></tr>`;
      });
      updateStats();
    });
    window.updateOrderStatus = async (id, status) => { await updateDoc(doc(db, 'orders', id), { status, updatedAt: new Date().toISOString() }); };

    window.addOffer = async () => {
      const code = document.getElementById('offerCode').value.trim();
      const discount = parseFloat(document.getElementById('offerDiscount').value);
      if (!code || isNaN(discount)) return alert('Enter code and discount');
      await addDoc(collection(db, 'offers'), { code, discount, active: true, createdAt: new Date().toISOString() });
      document.getElementById('offerCode').value = '';
      document.getElementById('offerDiscount').value = '';
    };
    onSnapshot(collection(db, 'offers'), (snap) => {
      const container = document.getElementById('offerList');
      container.innerHTML = '';
      snap.forEach(doc => {
        const d = doc.data();
        container.innerHTML += `<div class="offer-item"><span class="offer-info"><strong>${d.code}</strong> - ${d.discount}% off ${d.active ? '✅ Active' : '❌ Inactive'}</span><button class="btn btn-danger btn-sm" onclick="deleteDoc(doc(db,'offers','${doc.id}'))">Remove</button></div>`;
      });
    });

    async function loadRevenue() {
      try {
        const ordersSnap = await getDocs(collection(db, 'orders'));
        let total = 0, pending = 0, completed = 0, cancelled = 0;
        ordersSnap.forEach(d => {
          const data = d.data();
          if (data.status === 'pending') pending++;
          else if (data.status === 'completed') { completed++; total += data.total || 0; }
          else if (data.status === 'cancelled') cancelled++;
        });
        document.getElementById('revenueStats').innerHTML = `
          <div class="stat-card"><div class="stat-icon">💰</div><div class="stat-number">$${total.toFixed(2)}</div><div class="stat-label">Revenue</div></div>
          <div class="stat-card"><div class="stat-icon">✅</div><div class="stat-number">${completed}</div><div class="stat-label">Completed</div></div>
          <div class="stat-card"><div class="stat-icon">⏳</div><div class="stat-number">${pending}</div><div class="stat-label">Pending</div></div>
          <div class="stat-card"><div class="stat-icon">❌</div><div class="stat-number">${cancelled}</div><div class="stat-label">Cancelled</div></div>
        `;
      } catch (e) { console.warn('Revenue error:', e); }
    }
    setTimeout(() => { updateStats(); loadRevenue(); }, 500);
  </script>
</body>
</html>

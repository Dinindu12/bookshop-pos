<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookshop - Marketplace</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; }
    body { background:#f8f9fa; }
    .navbar { background:#2c3e50; color:white; padding:16px 24px; display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; z-index:100; flex-wrap:wrap; gap:8px; }
    .navbar input { padding:8px 16px; border-radius:20px; border:none; width:300px; max-width:100%; }
    .nav-links { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
    .nav-links button { border:none; padding:6px 12px; border-radius:6px; color:white; cursor:pointer; }
    .container { display:flex; gap:20px; padding:20px; max-width:1400px; margin:auto; flex-wrap:wrap; }
    .products { flex:3; display:grid; grid-template-columns:repeat(auto-fill, minmax(180px,1fr)); gap:16px; min-width:250px; }
    .card { background:white; border-radius:12px; padding:16px; box-shadow:0 2px 8px rgba(0,0,0,0.06); text-align:center; cursor:pointer; transition:0.2s; }
    .card:hover { transform:translateY(-4px); box-shadow:0 4px 16px rgba(0,0,0,0.12); }
    .card .icon { font-size:40px; }
    .card h3 { margin:8px 0; font-size:16px; }
    .card .price { color:#27ae60; font-weight:bold; }
    .card .stock { font-size:12px; color:#95a5a6; }
    .cart-side { flex:1; background:white; border-radius:12px; padding:16px; height:fit-content; position:sticky; top:80px; box-shadow:0 2px 8px rgba(0,0,0,0.06); max-height:80vh; overflow-y:auto; min-width:250px; }
    .cart-item { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #eee; align-items:center; }
    .checkout-btn { width:100%; padding:12px; background:#2ecc71; color:white; border:none; border-radius:8px; font-weight:bold; cursor:pointer; margin-top:12px; }
    .checkout-btn:hover { background:#27ae60; }
    .back-btn { background:#34495e; color:white; border:none; padding:8px 16px; border-radius:6px; cursor:pointer; margin-right:10px; }
    .logout-btn { background:#e74c3c; color:white; border:none; padding:6px 12px; border-radius:6px; cursor:pointer; }
    .badge { background:#e74c3c; color:white; padding:2px 8px; border-radius:12px; font-size:12px; margin-left:4px; }
    @media (max-width:768px) { .container { flex-direction:column; } .cart-side { position:relative; top:0; } }
  </style>
</head>
<body>
  <div class="navbar">
    <h2>📚 Bookshop</h2>
    <input type="text" id="searchInput" placeholder="🔍 Search books...">
    <div class="nav-links">
      <span id="userDisplay">👤 Customer</span>
      <button id="backToPos" style="display:none; background:#34495e;" onclick="window.location.href='pos.html'">⬅ Back to POS</button>
      <button class="logout-btn" onclick="window.location.href='index.html'">Logout</button>
    </div>
  </div>

  <div class="container">
    <div class="products" id="productList"></div>
    <div class="cart-side">
      <h3>🛒 Cart</h3>
      <div id="cartItems"></div>
      <div style="border-top:2px solid #ddd; padding-top:12px;">
        <p><strong>Total:</strong> $<span id="cartTotal">0.00</span></p>
        <button class="checkout-btn" id="checkoutBtn">Place Order</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { db, collection, onSnapshot, addDoc, updateDoc, doc, getDoc } from './firebase-config.js';
    import { auth, onAuthStateChanged } from './firebase-config.js';

    let products = [];
    let cart = [];
    let currentUser = null;
    let currentUserRole = '';

    onAuthStateChanged(auth, async (user) => {
      if (!user) { window.location.href = 'index.html'; }
      else {
        currentUser = user;
        document.getElementById('userDisplay').textContent = '👤 ' + user.email;
        const docSnap = await getDoc(doc(db, 'users', user.uid));
        if (docSnap.exists()) {
          currentUserRole = docSnap.data().role;
          if (currentUserRole === 'admin' || currentUserRole === 'owner') {
            document.getElementById('backToPos').style.display = 'inline-block';
          }
        }
      }
    });

    // Load Products
    onSnapshot(collection(db, 'items'), (snap) => {
      products = [];
      snap.forEach(doc => products.push({ id: doc.id, ...doc.data() }));
      renderProducts(products);
    });

    function renderProducts(list) {
      const container = document.getElementById('productList');
      container.innerHTML = '';
      list.forEach(p => {
        const div = document.createElement('div');
        div.className = 'card';
        div.innerHTML = `
          <div class="icon">📖</div>
          <h3>${p.name || 'Item'}</h3>
          <div class="price">$${p.price?.toFixed(2) || '0.00'}</div>
          <div class="stock">Stock: ${p.stock || 0}</div>
        `;
        if (p.stock > 0) div.onclick = () => addToCart(p);
        else { div.style.opacity = '0.5'; div.style.cursor = 'not-allowed'; }
        container.appendChild(div);
      });
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase();
      const filtered = products.filter(p => 
        (p.name && p.name.toLowerCase().includes(q)) || 
        (p.category && p.category.toLowerCase().includes(q))
      );
      renderProducts(filtered);
    });

    function addToCart(product) {
      const existing = cart.find(c => c.id === product.id);
      if (existing) {
        if (existing.qty < product.stock) existing.qty++;
        else alert('Out of stock!');
      } else {
        cart.push({ ...product, qty: 1 });
      }
      renderCart();
    }

    function renderCart() {
      const container = document.getElementById('cartItems');
      container.innerHTML = '';
      let total = 0;
      cart.forEach((item, idx) => {
        total += item.price * item.qty;
        const div = document.createElement('div');
        div.className = 'cart-item';
        div.innerHTML = `
          <span>${item.name || 'Item'} x ${item.qty}</span>
          <span>$${(item.price * item.qty).toFixed(2)} 
            <button onclick="window.removeFromCart(${idx})" style="background:#e74c3c;color:white;border:none;border-radius:50%;cursor:pointer;width:24px;height:24px;">x</button>
          </span>
        `;
        container.appendChild(div);
      });
      document.getElementById('cartTotal').textContent = total.toFixed(2);
    }
    window.removeFromCart = (idx) => { cart.splice(idx, 1); renderCart(); };

    // Checkout - Redirect to Confirmation Page
    document.getElementById('checkoutBtn').onclick = async () => {
      if (cart.length === 0) return alert('Cart is empty!');
      if (!currentUser) return alert('Please login first.');

      const customerName = prompt('Enter your Full Name:');
      const address = prompt('Enter your Delivery Address:');
      const phone = prompt('Enter your Phone Number:');
      if (!customerName || !address || !phone) return alert('All fields required!');

      const total = cart.reduce((s, i) => s + i.price * i.qty, 0);
      const orderData = {
        items: cart.map(i => ({ id: i.id, name: i.name, price: i.price, qty: i.qty })),
        total,
        customerName,
        address,
        phone,
        userId: currentUser.uid,
        userEmail: currentUser.email,
        status: 'pending',
        createdAt: new Date().toISOString(),
        billNumber: 'INV-' + Date.now()
      };

      try {
        const docRef = await addDoc(collection(db, 'orders'), orderData);

        // Reduce stock
        for (let item of cart) {
          const ref = doc(db, 'items', item.id);
          await updateDoc(ref, { stock: item.stock - item.qty });
        }

        // Redirect to confirmation page
        window.location.href = `order-confirmation.html?orderId=${docRef.id}`;
        
      } catch (err) {
        alert('Error placing order: ' + err.message);
      }
    };
  </script>
</body>
</html>
